name: Promote stable

# Auto-promotes STABLE_GLEMY_GAMES_REF to the most recent glemy-games
# `main` commit whose own CI (glemy-games' .github/workflows/ci.yml --
# gleam build/gleam test, both targets, which transitively builds glemy
# too via glemy-games' git dependency on it) actually succeeded -- never
# promotes an untested or failing commit, but no longer requires a
# deliberate manual commit either. Carries decision 0046/0057's model
# over to glemy-games post-split: previously this polled glemy's own CI
# directly (before games moved into glemy-games), now it polls
# glemy-games' CI instead, which itself only goes green when the glemy
# commit it currently depends on also builds and tests cleanly -- so a
# glemy-side regression still blocks promotion here, just one hop
# removed. See docs/decisions.jsonl for the decision that introduced
# this workflow and the one that introduced the glemy-games split.
#
# Polling on a schedule, not a push-triggered cross-repo dispatch: a
# real event-driven trigger (glemy-games' own CI notifying this repo the
# moment it goes green) needs a personal access token with cross-repo
# permissions stored as a secret here -- deliberately not set up
# without the user creating that secret themselves. The default
# GITHUB_TOKEN this workflow already has is scoped to this repository
# only, but reading a *different public* repository's Actions run
# history needs no authentication at all (confirmed directly: `gh api
# repos/recregt/glemy-games/actions/workflows/ci.yml/runs` returns real
# data with just this repo's own token), so a schedule is what's
# available without asking for more access than this repo already has.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # Needed for the explicit `gh workflow run deploy.yml` dispatch below
  # -- see that step's own comment for why a plain `git push` alone
  # doesn't reach deploy.yml here.
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout glemy-website
        uses: actions/checkout@v7

      - name: Find the latest glemy-games main commit with a passing CI run
        id: latest_green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/recregt/glemy-games/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$sha" ]; then
            echo "No successful glemy-games CI run found on main yet -- leaving STABLE_GLEMY_GAMES_REF unchanged."
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Update STABLE_GLEMY_GAMES_REF if a newer green commit exists
        id: update
        if: steps.latest_green.outputs.sha != ''
        run: |
          new="${{ steps.latest_green.outputs.sha }}"
          current="$(cat STABLE_GLEMY_GAMES_REF)"
          if [ "$current" = "$new" ]; then
            echo "STABLE_GLEMY_GAMES_REF is already at $new -- nothing to promote."
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$new" > STABLE_GLEMY_GAMES_REF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STABLE_GLEMY_GAMES_REF
          git commit -m "Auto-promote stable to glemy-games@${new:0:7} (CI passed)"
          git push
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      # A push made with the default GITHUB_TOKEN deliberately does NOT
      # trigger other workflows (GitHub's own anti-recursion guard on
      # push/other native events) -- confirmed directly: the first real
      # auto-promotion this workflow ever did pushed successfully but
      # deploy.yml never ran. workflow_dispatch calls are explicitly
      # exempted from that guard, so this dispatches deploy.yml
      # directly instead of relying on the push event to do it.
      - name: Trigger deploy.yml to publish the newly-promoted stable build
        if: steps.update.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
