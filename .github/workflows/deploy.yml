name: Build and deploy

# Rebuilds and republishes on every push, and once a day on a schedule
# (06:00 UTC) so the devlog and the live demo stay current even when
# glemy or glemy-games change without a corresponding push here -- all
# three repos are deliberately separate (see glemy's ARCHITECTURE.md /
# docs/decisions.jsonl for the reasoning, including the glemy-games
# split), so there's no single push event that naturally covers all of
# them. workflow_dispatch is there for a manual rebuild on demand, e.g.
# right after a real glemy or glemy-games release.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push should win over an in-flight
# older one rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout glemy-website
        uses: actions/checkout@v7

      # Only for decisions.jsonl/development-plan.jsonl below -- glemy
      # itself no longer gets built directly here (see glemy-games
      # checkouts below): games moved into their own repository, and
      # `gleam build` inside a glemy-games checkout pulls and builds
      # glemy automatically via its own git dependency. This checkout
      # always tracks glemy's default branch, independent of which
      # glemy-games commit is currently the stable demo -- decisions and
      # roadmap content track main regardless.
      - name: Checkout glemy (for decisions/roadmap content only)
        uses: actions/checkout@v7
        with:
          repository: recregt/glemy
          path: glemy-docs

      # "Edge" always tracks glemy-games' default branch directly.
      - name: Checkout glemy-games (edge)
        uses: actions/checkout@v7
        with:
          repository: recregt/glemy-games
          path: glemy-games-edge

      - name: Read the pinned stable glemy-games ref
        id: stable_ref
        run: echo "ref=$(cat STABLE_GLEMY_GAMES_REF)" >> "$GITHUB_OUTPUT"

      # "Stable" is pinned to whatever commit STABLE_GLEMY_GAMES_REF
      # names -- promoted automatically by promote-stable.yml once a
      # glemy-games commit's own CI passes (decision 0057's model,
      # carried over to glemy-games post-split), never an untested or
      # failing one. Kept as a genuinely separate checkout (not, e.g., a
      # git-reset on the edge one) so both builds exist side by side for
      # the same run.
      - name: Checkout glemy-games (stable)
        uses: actions/checkout@v7
        with:
          repository: recregt/glemy-games
          path: glemy-games-stable
          ref: ${{ steps.stable_ref.outputs.ref }}

      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "27"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Test glemy-website
        run: |
          gleam deps download
          gleam test

      - name: Fetch decisions.jsonl and development-plan.jsonl from glemy
        run: |
          cp glemy-docs/docs/decisions.jsonl decisions.jsonl
          cp glemy-docs/docs/development-plan.jsonl development-plan.jsonl

      # Building glemy-games alone is enough: its own git dependency on
      # glemy makes `gleam build` resolve and build glemy too, into the
      # same build/dev/javascript tree each HTML entry point already
      # expects (./build/dev/javascript/glemy/glemy/*.mjs for the engine,
      # ./build/dev/javascript/glemy_games/glemy_games/*.mjs for the
      # game itself) -- no separate glemy checkout/build step needed for
      # the demos anymore.
      - name: Build glemy-games's JavaScript target (edge)
        working-directory: glemy-games-edge
        run: gleam deps download && gleam build --target javascript

      - name: Build glemy-games's JavaScript target (stable)
        working-directory: glemy-games-stable
        run: gleam deps download && gleam build --target javascript

      # Preserves each checkout's own index.html's relative import paths
      # (./build/dev/javascript/<pkg>/<pkg>/*.mjs, covering both the
      # glemy engine and the glemy_games package built alongside it via
      # the git dependency) exactly, so the copied demo runs unmodified
      # -- the same output the local dev server already serves directly
      # from a glemy-games repo root. Two separate unhashed directories;
      # build.gleam content-hashes and renames each independently
      # (RM-024).
      #
      # Each additional game (Breakout, decisions 0052/0053; Platformer,
      # RM-034/decision 0060) gets its own pair of directories, renaming
      # its own HTML entry point to index.html on copy the same way --
      # each demo dir needs its own full copy of build/dev/javascript
      # (not a shared one) because build.gleam's prepare_play_demo_dir
      # renames the whole directory in place per demo, and a directory
      # can only be renamed once.
      #
      # Each game's copy is guarded by a real file-existence check, not
      # assumed unconditionally: even with promote-stable.yml's automatic
      # promotion, STABLE_GLEMY_GAMES_REF can still momentarily lag a
      # brand new game's own first commit (the promotion runs on its own
      # schedule, not synchronously with every glemy-games push), so a
      # game just added to glemy-games can genuinely have no HTML entry
      # point yet in glemy-games-stable. The whole per-demo block (mkdir
      # included, not just the cp) is skipped in that case -- creating an
      # empty static/play-demo-<game>-stable/ directory would make
      # build.gleam's prepare_play_demo_dir see an existing-but-empty
      # directory and hash/rename that instead of correctly falling back
      # to its own already-documented "directory doesn't exist" path (a
      # real, worse failure mode: a demo link that looks built but serves
      # nothing, instead of a 404 until stable catches up).
      - name: Copy the live demo builds into static assets
        run: |
          copy_demo() {
            local src_dir="$1" html_file="$2" dest_dir="$3"
            if [ -f "$src_dir/$html_file" ]; then
              mkdir -p "$dest_dir/build/dev"
              cp "$src_dir/$html_file" "$dest_dir/index.html"
              cp -r "$src_dir/build/dev/javascript" "$dest_dir/build/dev/javascript"
            else
              echo "Skipping $dest_dir: $src_dir/$html_file does not exist in this checkout."
            fi
          }

          copy_demo glemy-games-edge index.html static/play-demo-edge
          copy_demo glemy-games-stable index.html static/play-demo-stable
          copy_demo glemy-games-edge breakout.html static/play-demo-breakout-edge
          copy_demo glemy-games-stable breakout.html static/play-demo-breakout-stable
          copy_demo glemy-games-edge platformer.html static/play-demo-platformer-edge
          copy_demo glemy-games-stable platformer.html static/play-demo-platformer-stable

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # GitHub Pages serves a project site (no custom domain) under a
      # /<repo-name> subpath, not the domain root -- internal links need
      # that prefix or they 404 (confirmed live: see layout.gleam's
      # `url` doc comment). configure-pages' own base_url output already
      # tracks this correctly (a full absolute URL, also exactly what
      # canonical/OpenGraph tags and the sitemap/Atom feed need), and
      # goes back to the plain custom-domain URL automatically if one is
      # ever added.
      - name: Build the site
        run: gleam run -m build
        env:
          GLEMY_WEBSITE_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
