name: Build and deploy

# Rebuilds and republishes on every push, and once a day on a schedule
# (06:00 UTC) so the devlog and the live demo stay current even when
# glemy itself changes without a corresponding push here -- the two
# repos are deliberately separate (see glemy's ARCHITECTURE.md /
# docs/decisions.jsonl for the reasoning), so there's no single push
# event that naturally covers both. workflow_dispatch is there for a
# manual rebuild on demand, e.g. right after a real glemy release.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push should win over an in-flight
# older one rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout glemy-website
        uses: actions/checkout@v7

      # "Edge" always tracks glemy's default branch directly -- decisions
      # and roadmap content are also fetched from here, since those track
      # main regardless of which build is currently the stable demo.
      - name: Checkout glemy (edge)
        uses: actions/checkout@v7
        with:
          repository: recregt/glemy
          path: glemy-edge

      - name: Read the pinned stable glemy ref
        id: stable_ref
        run: echo "ref=$(cat STABLE_GLEMY_REF)" >> "$GITHUB_OUTPUT"

      # "Stable" is pinned to whatever commit STABLE_GLEMY_REF names --
      # promoted automatically by promote-stable.yml once a glemy commit's
      # own CI passes (decision 0057, docs/technical-architecture.md
      # §3.4, RM-025), never an untested or failing one. Kept as a
      # genuinely separate checkout (not, e.g., a git-reset on the edge
      # one) so both builds exist side by side for the same run.
      - name: Checkout glemy (stable)
        uses: actions/checkout@v7
        with:
          repository: recregt/glemy
          path: glemy-stable
          ref: ${{ steps.stable_ref.outputs.ref }}

      - uses: erlef/setup-beam@v1.24.1
        with:
          otp-version: "27"
          gleam-version: "1.18.1"
          rebar3-version: "3"

      - name: Test glemy-website
        run: |
          gleam deps download
          gleam test

      - name: Fetch decisions.jsonl and development-plan.jsonl from glemy
        run: |
          cp glemy-edge/docs/decisions.jsonl decisions.jsonl
          cp glemy-edge/docs/development-plan.jsonl development-plan.jsonl

      - name: Build glemy's JavaScript target (edge)
        working-directory: glemy-edge
        run: gleam deps download && gleam build --target javascript

      - name: Build glemy's JavaScript target (stable)
        working-directory: glemy-stable
        run: gleam deps download && gleam build --target javascript

      # Preserves each checkout's own index.html's relative import paths
      # (./build/dev/javascript/glemy/glemy/*.mjs) exactly, so the
      # copied demo runs unmodified -- the same output the local dev
      # server already serves directly from a glemy repo root. Two
      # separate unhashed directories; build.gleam content-hashes and
      # renames each independently (RM-024).
      #
      # Each additional game (Breakout, decisions 0052/0053; Platformer,
      # RM-034/decision 0060) gets its own pair of directories, renaming
      # its own HTML entry point to index.html on copy the same way --
      # each demo dir needs its own full copy of build/dev/javascript
      # (not a shared one) because build.gleam's prepare_play_demo_dir
      # renames the whole directory in place per demo, and a directory
      # can only be renamed once.
      #
      # Each game's copy is guarded by a real file-existence check, not
      # assumed unconditionally: even with promote-stable.yml's automatic
      # promotion (decision 0057), STABLE_GLEMY_REF can still momentarily
      # lag a brand new game's own first commit (the promotion runs on
      # its own schedule, not synchronously with every glemy push), so a
      # game just added to glemy can genuinely have no HTML entry point
      # yet in glemy-stable. The whole per-demo block (mkdir included,
      # not just the cp) is skipped in that case -- creating an empty
      # static/play-demo-<game>-stable/ directory would make
      # build.gleam's prepare_play_demo_dir see an existing-but-empty
      # directory and hash/rename that instead of correctly falling back
      # to its own already-documented "directory doesn't exist" path (a
      # real, worse failure mode: a demo link that looks built but serves
      # nothing, instead of a 404 until stable catches up).
      - name: Copy the live demo builds into static assets
        run: |
          copy_demo() {
            local src_dir="$1" html_file="$2" dest_dir="$3"
            if [ -f "$src_dir/$html_file" ]; then
              mkdir -p "$dest_dir/build/dev"
              cp "$src_dir/$html_file" "$dest_dir/index.html"
              cp -r "$src_dir/build/dev/javascript" "$dest_dir/build/dev/javascript"
            else
              echo "Skipping $dest_dir: $src_dir/$html_file does not exist in this checkout."
            fi
          }

          copy_demo glemy-edge index.html static/play-demo-edge
          copy_demo glemy-stable index.html static/play-demo-stable
          copy_demo glemy-edge breakout.html static/play-demo-breakout-edge
          copy_demo glemy-stable breakout.html static/play-demo-breakout-stable
          copy_demo glemy-edge platformer.html static/play-demo-platformer-edge
          copy_demo glemy-stable platformer.html static/play-demo-platformer-stable

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # GitHub Pages serves a project site (no custom domain) under a
      # /<repo-name> subpath, not the domain root -- internal links need
      # that prefix or they 404 (confirmed live: see layout.gleam's
      # `url` doc comment). configure-pages' own base_url output already
      # tracks this correctly (a full absolute URL, also exactly what
      # canonical/OpenGraph tags and the sitemap/Atom feed need), and
      # goes back to the plain custom-domain URL automatically if one is
      # ever added.
      - name: Build the site
        run: gleam run -m build
        env:
          GLEMY_WEBSITE_BASE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
